name: Build APK

# Two kinds of build, each with its own signing key:
#   - Test builds: every push to main (and PRs / manual runs). The `dev` variant
#     ("Contacts Dev", app id app.people.contacts.dev), always signed with the dev
#     key so each one installs over the last.
#   - Releases: the "Build release" workflow (release.yml), a push to the `release`
#     branch, or a version tag such as v1.0. The `release` variant, signed with the
#     separate release key, attached to a GitHub Release tagged v<version name from
#     version.txt>, with that version's CHANGELOG.md section as its notes.

on:
  push:
    branches: [main, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Called by release.yml once it has committed the new version.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        description: Commit to build
        type: string
        default: ''

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-24.04 ships the Android SDK preinstalled, which the newer
    # ubuntu-latest image (Ubuntu 26) may not.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # to publish GitHub Releases for version tags
    env:
      IS_RELEASE: ${{ inputs.release || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Use the runner's preinstalled SDK; Gradle downloads any missing platform itself
      # once the licenses are accepted.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK not found on this runner}"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # Picks the key for this kind of build. A release must have its key; a test build
      # without the dev key falls back to a throwaway one and says so.
      - name: Set up signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DEV_KEYSTORE_BASE64: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            KEY="$RELEASE_KEYSTORE_BASE64"; PASS="$RELEASE_KEYSTORE_PASSWORD"; ALIAS=contacts
            if [ -z "$KEY" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is not set; refusing to publish an unsigned release."
              exit 1
            fi
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            KEY="$DEV_KEYSTORE_BASE64"; PASS="$DEV_KEYSTORE_PASSWORD"; ALIAS=contacts-dev
            echo "VARIANT=dev" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/signing.jks"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/signing.jks"
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$PASS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$PASS"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No DEV_KEYSTORE_BASE64 secret set; this test build is signed with a throwaway key."
          fi

      # On failure, Gradle's error summary and compiler errors are re-emitted as
      # annotations so they show on the run page without opening the full log.
      - name: Build APK
        run: |
          set -o pipefail
          TASK=":contacts:assemble${VARIANT^}"
          if ./gradlew "$TASK" --console=plain 2>&1 | tee build.log; then
            exit 0
          fi
          grep -E '^e: |^ERROR|Error: |error: ' build.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          summary=$(awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$summary" ] && echo "::error title=Gradle failure::${summary}"
          exit 1

      # Prints the signing certificate's SHA-256 on the run page, so it is easy to confirm
      # every build of a kind is signed with the same key.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls contacts/build/outputs/apk/$VARIANT/*.apk | head -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          echo "::notice title=${VARIANT} signing certificate SHA-256::$FP"

      - uses: actions/upload-artifact@v4
        with:
          name: contacts-${{ env.VARIANT }}-apk
          path: contacts/build/outputs/apk/${{ env.VARIANT }}/*.apk
          if-no-files-found: error

      - name: Read version
        if: env.IS_RELEASE == 'true'
        run: |
          VERSION=$(sed -n 2p version.txt | tr -d '[:space:]')
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          # This version's section of CHANGELOG.md becomes the release notes.
          awk -v h="## $VERSION" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section for this release."
            exit 1
          fi

      # Creates the tag when it doesn't exist yet (a push to the release branch).
      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: Contacts ${{ env.RELEASE_TAG }}
          files: contacts/build/outputs/apk/release/*.apk
          body_path: ${{ runner.temp }}/notes.md
