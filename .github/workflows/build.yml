name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-24.04 ships the Android SDK preinstalled, which the newer
    # ubuntu-latest image (Ubuntu 26) may not.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Use the runner's preinstalled SDK; Gradle downloads any missing platform itself
      # once the licenses are accepted.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:?Android SDK not found on this runner}"
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      # Optional stable signing key. Without these secrets the APK is signed with the
      # runner's throwaway debug key, so each build would need an uninstall before it
      # can be installed over the previous one.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using release signing key from secrets."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set; APK is signed with a throwaway debug key."
          fi

      # On failure, Gradle's error summary and compiler errors are re-emitted as
      # annotations so they show on the run page without opening the full log.
      - name: Build release APK
        run: |
          set -o pipefail
          if ./gradlew :contacts:assembleRelease --console=plain 2>&1 | tee build.log; then
            exit 0
          fi
          grep -E '^e: |^ERROR|Error: |error: ' build.log | head -20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          summary=$(awk '/What went wrong:/{f=1} /\* Try:/{f=0} f' build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$summary" ] && echo "::error title=Gradle failure::${summary}"
          exit 1

      # Prints the signing certificate's SHA-256 on the run page. With the release key set up
      # it is the same on every build, which is what lets a new APK install over the last one.
      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls contacts/build/outputs/apk/release/*.apk | head -1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          echo "::notice title=Signing certificate SHA-256::$FP"

      - uses: actions/upload-artifact@v4
        with:
          name: contacts-apk
          path: contacts/build/outputs/apk/release/*.apk
          if-no-files-found: error
